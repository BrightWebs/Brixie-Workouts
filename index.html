<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rebuild — Gym Comeback Tracker</title>
<meta name="description" content="Full-body gym comeback plan with animated exercise guides, workout logging, calorie estimates and progress goals.">
<meta name="theme-color" content="#0B0D10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rebuild">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0D10;--s1:#14171C;--s2:#1B1F25;--s3:#242930;--ln:#2A3038;
  --tx:#F3F5F7;--mu:#A0A8B3;--mu2:#6F7884;
  --ac:#C8F135;--ink:#0B0D10;
  --warm:#FF9F43;--mob:#4FC3F7;--str:#C8F135;--cool:#B79CFF;--bad:#FF6B6B;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--ac)}
.app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 100px)}
h1,h2,h3,.num{font-family:"Barlow Condensed",Inter,sans-serif;font-weight:700;letter-spacing:.3px;margin:0}
h1{font-size:34px;line-height:1}
h2{font-size:26px;line-height:1.05}
h3{font-size:19px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.9px;text-transform:uppercase;color:var(--mu)}
.muted{color:var(--mu)}
.small{font-size:13px}
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 18px}
.avatar{width:42px;height:42px;border-radius:50%;border:1px solid var(--ln);background:var(--s2);display:grid;place-items:center;color:var(--mu)}
.avatar svg{width:22px;height:22px}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:var(--r);padding:16px;margin:0 0 14px}
.hero{background:linear-gradient(150deg,#1d2410 0%,#151a10 35%,var(--s1) 75%);border:1px solid #33401a;border-radius:22px;padding:18px;margin-bottom:22px;position:relative;overflow:hidden}
.hero .fig{position:absolute;right:-6px;top:-8px;width:118px;height:118px;opacity:.95;background:none}
.hero .stats3{position:relative;z-index:1}
.hero h2{font-size:30px;max-width:62%}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.stat{background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:10px 12px}
.stat .num{font-size:26px;line-height:1}
.stat .lbl{font-size:11.5px;color:var(--mu);margin-top:3px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;background:var(--ac);color:var(--ink);font-weight:700;font-size:16px;padding:15px 18px}
.btn:active{transform:scale(.985)}
.btn2{display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--ln);border-radius:14px;background:var(--s2);color:var(--tx);font-weight:600;padding:13px 16px}
.btn2.sm,.btn.sm{padding:9px 12px;font-size:14px;border-radius:11px;width:auto}
.danger{color:var(--bad)}
.row2{display:flex;gap:10px}
.row2>*{flex:1}
.banner{display:flex;gap:12px;align-items:center;background:#1a2230;border:1px solid #2b3a52;border-radius:16px;padding:12px 14px;margin-bottom:14px;width:100%;text-align:left;color:var(--tx)}
.banner b{display:block}
.sech{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 10px}
.sech .t{display:flex;align-items:center;gap:9px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.sech h3{font-size:20px}
.sech .m{font-size:12.5px;color:var(--mu)}
.secdesc{font-size:13px;color:var(--mu);margin:-6px 2px 10px 21px}
.list{background:var(--s1);border:1px solid var(--ln);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;background:none;border:0;border-bottom:1px solid var(--ln);text-align:left;color:var(--tx)}
.item:last-child{border-bottom:0}
.item:active{background:var(--s2)}
.thumb{width:54px;height:54px;flex:none;border-radius:12px;background:var(--s2)}
.item .rt{flex:1;min-width:0}
.item .rn{font-weight:600}
.item .rs{font-size:12.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .rr{font-size:12px;color:var(--mu);text-align:right;flex:none}
.item .rr b{display:block;color:var(--tx);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font-size:12px;font-weight:600;border-radius:999px;padding:5px 10px;background:var(--s3);color:var(--tx)}
.chip.k{background:rgba(200,241,53,.14);color:var(--ac)}
.fig{background:radial-gradient(circle at 50% 38%,#1f242c 0%,#14171c 70%);border-radius:16px}
.fig svg{display:block;width:100%;height:100%}
.fl{stroke:#2F3640;stroke-width:1.5}
.near{stroke:#EEF1F4;stroke-width:7.5;stroke-linecap:round;stroke-linejoin:round;fill:none}
.far{stroke:#5F6977;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;fill:none}
.tor{stroke:#EEF1F4;stroke-width:11;stroke-linecap:round;fill:none}
.hd{fill:#EEF1F4}
.human-skin{fill:#bdcad8}
.human-far{fill:#536477}
.human-shorts{fill:#303b49;stroke:#526171;stroke-width:.8}
.face{stroke:#394655;stroke-linecap:round}
.e1{stroke:#3C444F;stroke-linecap:round;fill:none}
.e2{fill:#262C35;stroke:#3C444F;stroke-width:1.5}
.e3{stroke:#5A6470;stroke-linecap:round;fill:none}
.pad{stroke:#323A45;stroke-linecap:round;fill:none}
.ac{fill:var(--ac)}
.acs{stroke:var(--ac);stroke-linecap:round;stroke-linejoin:round;fill:none}
.cb{stroke:#97A1AD;stroke-width:1.4}
.belt{stroke:#56606C;stroke-width:2;stroke-dasharray:5 6}
.mat{fill:#1E2B33}
.disp{fill:#0f1a05}
/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);animation:fade .18s}
.sheet .pnl{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--s1);border:1px solid var(--ln);border-bottom:0;border-radius:24px 24px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 22px);animation:up .24s cubic-bezier(.2,.8,.2,1)}
.grab{width:42px;height:5px;border-radius:3px;background:var(--s3);margin:2px auto 10px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.x{position:sticky;top:0;float:right;width:34px;height:34px;border-radius:50%;border:0;background:var(--s3);color:var(--tx);font-size:18px;line-height:34px;z-index:2}
.bigfig{height:250px;margin:6px 0 12px}
ul.cues{margin:8px 0 0;padding-left:20px}
ul.cues li{margin:5px 0}
.warn{background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.25);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:10px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.kv>div{background:var(--s2);border-radius:12px;padding:10px 12px}
.kv .num{font-size:22px}
.kv .lbl{font-size:12px;color:var(--mu)}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(12,14,17,.9);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--ln);padding:6px 8px calc(env(safe-area-inset-bottom) + 6px)}
nav.tabs .in{display:flex;max-width:560px;margin:0 auto}
nav.tabs button{flex:1;background:none;border:0;color:var(--mu2);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0}
nav.tabs button.on{color:var(--ac)}
nav.tabs svg{width:24px;height:24px}
.resume{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 70px);z-index:31;border:0;border-radius:999px;background:var(--ac);color:var(--ink);font-weight:700;padding:11px 18px;box-shadow:0 8px 30px rgba(0,0,0,.5);display:flex;gap:8px;align-items:center}
/* workout */
.wo{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch}
.wo .wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 120px)}
.wohead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.clock{font-family:"Barlow Condensed";font-weight:700;font-size:24px;letter-spacing:.5px}
.clock small{font-family:Inter;font-weight:500;font-size:12px;color:var(--mu);display:block;text-align:center;letter-spacing:0;margin-top:-2px}
.ic{width:40px;height:40px;border-radius:12px;border:1px solid var(--ln);background:var(--s2);display:grid;place-items:center;color:var(--tx)}
.ic svg{width:20px;height:20px}
.pill{border:0;border-radius:12px;background:var(--ac);color:var(--ink);font-weight:700;padding:10px 14px}
.seg{display:flex;gap:3px;margin:14px 0 10px}
.seg i{flex:1;height:5px;border-radius:3px;background:var(--s3)}
.seg i.d{background:var(--c);opacity:.55}
.seg i.c{background:var(--c);opacity:1;box-shadow:0 0 0 1px var(--c)}
.wofig{height:min(42vh,300px);margin:6px 0 12px}
details.how{background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:11px 14px;margin:10px 0 14px}
details.how summary{font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.how summary::-webkit-details-marker{display:none}
details.how summary:after{content:"+";color:var(--mu)}
details[open].how summary:after{content:"–"}
.cd{font-size:72px;text-align:center;line-height:1;margin:6px 0 4px}
.bar{height:6px;border-radius:3px;background:var(--s3);overflow:hidden;margin:6px 0 14px}
.bar>i{display:block;height:100%;background:var(--ac);border-radius:3px}
table.sets{width:100%;border-collapse:separate;border-spacing:0 6px}
table.sets th{font-size:11.5px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.6px;text-align:center;padding:0 2px}
table.sets td{text-align:center;padding:0 2px}
table.sets tr.d td{background:rgba(200,241,53,.08)}
table.sets td:first-child{border-radius:10px 0 0 10px;font-weight:700;width:34px}
table.sets td:last-child{border-radius:0 10px 10px 0;width:48px}
table.sets td.prev{color:var(--mu);font-size:13px}
.inp{width:100%;max-width:84px;text-align:center;background:var(--s2);border:1px solid var(--ln);border-radius:10px;padding:10px 4px;font-weight:600;font-size:16px}
.inp:focus{outline:2px solid var(--ac);border-color:transparent}
.chk{width:40px;height:40px;border-radius:10px;border:1px solid var(--ln);background:var(--s2);display:grid;place-items:center;color:var(--mu)}
tr.d .chk{background:var(--ac);border-color:var(--ac);color:var(--ink)}
.chk svg{width:20px;height:20px}
.wonav{position:fixed;left:0;right:0;bottom:0;z-index:41;background:linear-gradient(to top,var(--bg) 70%,rgba(11,13,16,0));padding:20px 16px calc(env(safe-area-inset-bottom) + 12px)}
.wonav .in{max-width:528px;margin:0 auto;display:flex;gap:10px}
.wonav .btn2{flex:0 0 34%}
.rest{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 84px);z-index:42;max-width:536px;margin:0 auto;background:#1c2410;border:1px solid #3c4d17;border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.rest .num{font-size:30px;color:var(--ac);min-width:62px}
.rest .grow{flex:1;font-size:13px;color:var(--mu)}
.rest button{border:0;border-radius:10px;background:rgba(255,255,255,.08);padding:8px 10px;font-weight:600}
.hidden{display:none!important}
/* forms */
label.f{display:block;margin:0 0 12px}
label.f span{display:block;font-size:12.5px;color:var(--mu);margin-bottom:5px;font-weight:600}
.field{width:100%;background:var(--s2);border:1px solid var(--ln);border-radius:12px;padding:12px;font-size:16px}
.field:focus{outline:2px solid var(--ac);border-color:transparent}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
textarea.field{min-height:90px;font-size:12px;font-family:ui-monospace,Menlo,monospace}
/* charts */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y}
.gl{stroke:#232830;stroke-width:1}
.axl{fill:#7A838F;font-size:10px;font-family:Inter}
.tip{position:absolute;top:0;pointer-events:none;background:#0b0d10;border:1px solid var(--ln);border-radius:10px;padding:6px 9px;font-size:12px;white-space:nowrap;transform:translateX(-50%);box-shadow:0 6px 18px rgba(0,0,0,.5)}
.tip b{display:block;font-size:14px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tile{background:var(--s1);border:1px solid var(--ln);border-radius:16px;padding:14px}
.tile .num{font-size:32px;line-height:1}
.tile .lbl{font-size:12.5px;color:var(--mu);margin-top:4px}
.empty{text-align:center;padding:26px 14px;color:var(--mu)}
.empty .fig{width:120px;height:120px;margin:0 auto 10px}
.hist{border-top:1px solid var(--ln);padding:12px 0}
.hist:first-of-type{border-top:0}
.hist .h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hist .d{font-size:12.5px;color:var(--mu);margin-top:6px}
select.field{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,#8a94a0 50%),linear-gradient(135deg,#8a94a0 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
/* goals */
.tl{position:relative;margin-left:8px;padding-left:22px;border-left:2px solid var(--ln)}
.ms{position:relative;margin:0 0 18px}
.ms:before{content:"";position:absolute;left:-30px;top:4px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--mu2)}
.ms.done:before{background:var(--ac);border-color:var(--ac)}
.ms.now:before{background:var(--bg);border-color:var(--ac);box-shadow:0 0 0 5px rgba(200,241,53,.18)}
.ms .when{font-size:12px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--mu)}
.ms.now .when{color:var(--ac)}
.ms h3{margin:2px 0 6px}
.ms ul{margin:6px 0;padding-left:18px;font-size:14px}
.ms li{margin:3px 0}
.tgt{display:grid;grid-template-columns:1fr auto;gap:4px 12px;background:var(--s1);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:8px}
.tgt .v{font-weight:700;text-align:right}
.ring{display:flex;align-items:center;gap:14px}
.ring svg{width:78px;height:78px;flex:none}
.src li{margin:6px 0;font-size:13.5px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translateX(-50%);z-index:60;background:#20261a;border:1px solid #3c4d17;color:var(--tx);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;animation:fade .2s}
.pr{display:inline-block;background:var(--ac);color:var(--ink);font-weight:800;font-size:11px;border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:2px}
.planner{border-color:#3a4820;background:linear-gradient(145deg,#191f12,var(--s1) 60%)}
.plan-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.plan-stat{background:rgba(0,0,0,.24);border:1px solid var(--ln);border-radius:12px;padding:9px}
.plan-stat b{display:block;font:700 22px/1 "Barlow Condensed",Inter,sans-serif}
.plan-stat span{font-size:11px;color:var(--mu)}
.plan-tools{display:flex;gap:8px;align-items:center;margin:10px 0}
.plan-filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:-2px 0 10px}
.plan-tools .field{min-width:0}
.plan-tools .search{flex:1}
.plan-item{display:flex;align-items:center;gap:8px;flex:none}
.plan-item input{width:20px;height:20px;accent-color:var(--ac)}
.library-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--ln)}
.library-item:last-child{border-bottom:0}
.library-item .item-open{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:0;border:0;background:none;text-align:left}
.library-item .item-open .rt{flex:1;min-width:0}
.library-item .rn{display:block;font-weight:600;overflow-wrap:anywhere}
.library-item .rs{display:block;font-size:12.5px;color:var(--mu);overflow-wrap:anywhere}
.library-item .rr{max-width:80px;font-size:12px;color:var(--mu);text-align:right;overflow-wrap:anywhere}
.library-item .rr b{display:block;color:var(--tx);font-size:13px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.grow{flex:1;min-width:0}
.builder-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.builder-fields .field,.builder-move .field{min-width:0}
.builder-actions{display:flex;flex-wrap:wrap;gap:8px}
.builder-move,.builder-preview{border-top:1px solid var(--ln);padding:16px 0}
.builder-move:first-child,.builder-preview:first-child{border-top:0}
.builder-picker{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.builder-pick{min-width:0;padding:12px;border:1px solid var(--ln);border-radius:14px;background:var(--s2)}
.builder-pick .row{margin-bottom:12px}
.builder-pick b{font-size:13px}
.builder-pick .row2{flex-wrap:wrap}
.schedule-days{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0;font-size:13px}
.schedule-days input{accent-color:var(--ac)}
.week-grid{display:grid;grid-template-columns:1fr;gap:10px}
.week-day{min-width:0;padding:12px;border:1px solid var(--ln);border-radius:14px}
.week-event{margin-top:10px;padding:10px;border-radius:10px;background:var(--s2)}
.week-event .builder-actions{margin-top:8px}
.movement-stages{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.movement-stages svg{display:block;width:100%;height:150px}
.movement-stage{background:var(--s2);border-radius:12px;text-align:center;padding:8px;font-size:12px}
.paused-banner{border:1px solid var(--ac);background:#263018;padding:12px;border-radius:12px;margin:12px 0}
@media(max-width:380px){.builder-picker{grid-template-columns:1fr}.rest{flex-wrap:wrap}.rest .grow{min-width:120px}nav.tabs button{font-size:9px}}
@media(min-width:900px){body[data-view="planner"] .app{max-width:1080px}body[data-view="planner"] nav.tabs .in{max-width:1080px}.week-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.builder-picker{grid-template-columns:repeat(3,minmax(0,1fr))}.builder-fields{grid-template-columns:repeat(3,minmax(0,1fr))}}
.welcome{position:relative;overflow:hidden;padding:24px 20px;border:1px solid #465926;border-radius:24px;background:radial-gradient(ellipse at top right,#354518,var(--s1) 65%);margin-bottom:18px}
.welcome-demo{display:none}
.welcome h1{font-size:46px;line-height:1.04;max-width:380px;margin:12px 0}
.welcome p{max-width:420px}
.goal-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}
.goal-card{min-width:0;text-align:left;padding:16px;border:1px solid var(--ln);border-radius:16px;background:var(--s1);transition:background .2s,border-color .2s,transform .2s}
.goal-card:hover{transform:translateY(-2px);border-color:var(--ac)}
.goal-card[aria-pressed="true"]{border-color:var(--ac);background:#242e15}
.goal-card b,.goal-card span{display:block}
.goal-card .goal-number{color:var(--ac);font:700 26px "Barlow Condensed",sans-serif;margin-bottom:8px}
.goal-card span{font-size:12px;color:var(--mu);margin-top:5px}
.journey-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.journey-options .field{min-width:0}
.muscle-panel{background:var(--s2);border:1px solid var(--ln);border-radius:16px;padding:14px;margin:12px 0}
.muscle-views{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:320px;margin:12px auto}
.muscle-view{text-align:center;font-size:11px;color:var(--mu)}
.muscle-view svg{display:block;width:100%;height:220px}
.muscle-region{fill:#303943;stroke:#66717f;stroke-width:1}
.muscle-region.primary{fill:var(--ac);stroke:#e7ffab}
.muscle-region.secondary{fill:var(--mob);stroke:#b2e9ff}
.muscle-legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;margin-top:8px}
.muscle-legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--ac)}
.muscle-legend .support i{background:var(--mob)}
.muscle-tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.muscle-tags button{border:1px solid var(--ln);border-radius:999px;background:var(--s2);padding:7px 10px;font-size:12px}
.muscle-tags button[aria-pressed="true"]{background:var(--ac);color:var(--ink)}
.source-links a{display:block;margin:10px 0;font-size:13px}
#view.page-enter{animation:page-enter .28s ease-out}
@keyframes page-enter{from{opacity:.3;transform:translateY(9px)}to{opacity:1;transform:none}}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media(max-width:360px){.goal-card{padding:12px}.welcome h1{font-size:38px}nav.tabs button{font-size:10px}}
@media(min-width:900px){
  body[data-view="home"] .app,body[data-view="machines"] .app{max-width:1080px}
  body[data-view="home"] nav.tabs .in,body[data-view="machines"] nav.tabs .in{max-width:1080px}
  .welcome{padding:36px}
  .welcome h1{font-size:58px;max-width:620px}
  .welcome .row2{max-width:520px}
  .welcome-demo{display:block;position:absolute;right:36px;top:35px;width:260px;height:280px;opacity:.85;pointer-events:none}
  .welcome-demo svg{width:100%;height:100%}
  .goal-grid{grid-template-columns:repeat(5,minmax(0,1fr))}
  .catalog-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
.stage-note{background:var(--s2);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:13px;color:var(--mu)}
.catalog-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.catalog-card{background:var(--s1);border:1px solid var(--ln);border-radius:16px;padding:14px;min-width:0}
.catalog-card .fig{height:150px;margin:10px 0}
.catalog-tools{display:grid;grid-template-columns:1fr auto;gap:8px;margin:12px 0}
.catalog-tools .field{min-width:0}
.code{font:600 11px ui-monospace,monospace;color:var(--mu);background:var(--s2);border-radius:7px;padding:4px 7px}
.print-root{display:none}
.print-guide{font:14px/1.5 Arial,sans-serif;color:#111;max-width:760px;margin:0 auto}
.print-guide h1,.print-guide h2,.print-guide h3{font-family:Arial,sans-serif;color:#111}
.print-guide h1{font-size:26px;margin:0 0 4px}
.print-guide h2{font-size:17px;margin:18px 0 6px}
.print-guide .print-meta{color:#444;border-bottom:2px solid #222;padding-bottom:10px}
.print-guide li{margin:5px 0}
.print-guide .print-warning{border:1px solid #777;padding:9px;margin-top:12px}
@media(max-width:420px){.plan-grid{gap:5px}.plan-stat{padding:8px 6px}.plan-stat b{font-size:19px}.catalog-grid{grid-template-columns:1fr}.catalog-tools{grid-template-columns:1fr}.library-item{padding:9px 8px}.plan-tools{align-items:stretch}}
@media print{
  body>*:not(#printRoot){display:none!important}
  #printRoot{display:block!important;background:#fff;color:#111;position:absolute;inset:0;padding:16mm}
  .print-guide{display:block}
}
@media (min-width:600px){.app{padding-top:28px}}

<script>
"use strict";
/* ================= storage ================= */
const KEY='rebuild.v1', AKEY='rebuild.active';
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
let DB=store.get(KEY,null)||{profile:{ft:5,inch:8,lb:163,age:'',sex:'',perWeek:3,set:false},sessions:[],bw:[]};
DB.profile=Object.assign({ft:5,inch:8,lb:163,age:'',sex:'',perWeek:3,set:false},DB.profile||{});
DB.sessions=DB.sessions||[];DB.bw=DB.bw||[];
let ACTIVE=store.get(AKEY,null);
function save(){if(!store.set(KEY,DB)){toast('Could not save changes. Check browser storage access and keep a backup');return false}return true}
function saveA(){if(ACTIVE){if(!store.set(AKEY,ACTIVE))toast('Could not save the active workout. Check browser storage access')}else store.del(AKEY)}

/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const n1=v=>(+v).toFixed(1);
const pt=p=>n1(p[0])+","+n1(p[1]);
const add=(a,b)=>[a[0]+b[0],a[1]+b[1]];
const mul=(a,k)=>[a[0]*k,a[1]*k];
const nrm=a=>{const d=Math.hypot(a[0],a[1])||1;return[a[0]/d,a[1]/d]};
const ping=p=>(1-Math.cos(2*Math.PI*p))/2;
const D2R=Math.PI/180;
function fmtT(sec){sec=Math.max(0,Math.round(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`}
function fmtMin(sec){const m=Math.round(sec/60);return m<60?`${m} min`:`${Math.floor(m/60)}h ${m%60}m`}
const fmtD=iso=>new Date(iso).toLocaleDateString(undefined,{month:'short',day:'numeric'});
const fmtDL=iso=>new Date(iso).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
const round5=v=>Math.max(5,Math.round(v/5)*5);
const round25=v=>Math.max(2.5,Math.round(v/2.5)*2.5);

/* ================= figure engine ================= */
const L={torso:46,ua:26,fa:24,th:36,sh:36,neck:14,head:9};
function ik(a,b,l1,l2,pref){
  let dx=b[0]-a[0],dy=b[1]-a[1];let d=Math.hypot(dx,dy);
  if(d<1){dx=0;dy=1;d=1}
  const max=l1+l2-0.4;
  if(d>=max){const u=[dx/d,dy/d];return{j:add(a,mul(u,l1)),e:add(a,mul(u,max))}}
  const dd=Math.max(d,Math.abs(l1-l2)+0.5);
  const base=Math.atan2(dy,dx);
  const al=Math.acos(Math.max(-1,Math.min(1,(l1*l1+dd*dd-l2*l2)/(2*l1*dd))));
  const j1=[a[0]+l1*Math.cos(base+al),a[1]+l1*Math.sin(base+al)];
  const j2=[a[0]+l1*Math.cos(base-al),a[1]+l1*Math.sin(base-al)];
  const m=[(a[0]+b[0])/2,(a[1]+b[1])/2];
  const s1=(j1[0]-m[0])*pref[0]+(j1[1]-m[1])*pref[1];
  const s2=(j2[0]-m[0])*pref[0]+(j2[1]-m[1])*pref[1];
  return{j:s1>=s2?j1:j2,e:b};
}
function solve(P){
  const t=P.t*D2R;const up=[Math.sin(t),-Math.cos(t)];const n=[Math.cos(t),Math.sin(t)];
  const hip=P.h;const sh=add(hip,mul(up,L.torso));
  const ht=t+(P.ht||0)*D2R;const head=add(sh,[Math.sin(ht)*L.neck,-Math.cos(ht)*L.neck]);
  const hand=P.hand||add(sh,P.handRel||[0,46]);
  const hand2=P.hand2||(P.handRel2?add(sh,P.handRel2):hand);
  const eb=nrm(P.eb||[0,1]),eb2=nrm(P.eb2||P.eb||[0,1]);
  const kb=nrm(P.kb||[1,0]),kb2=nrm(P.kb2||P.kb||[1,0]);
  const arm1=ik(sh,hand,L.ua,L.fa,eb),arm2=ik(sh,hand2,L.ua,L.fa,eb2);
  const leg1=ik(hip,P.foot,L.th,L.sh,kb),leg2=ik(hip,P.foot2||P.foot,L.th,L.sh,kb2);
  return{hip,sh,head,up,n,arm1,arm2,leg1,leg2,curve:P.curve||0,toe:P.toe||[1,0],toe2:P.toe2||P.toe||[1,0],
    hand:arm1.e,elb:arm1.j,knee:leg1.j,ank:leg1.e,hand2:arm2.e};
}
function mix(a,b,e){
  if(typeof a==='number')return a+((typeof b==='number'?b:a)-a)*e;
  if(Array.isArray(a))return a.map((v,i)=>mix(v,b?b[i]:v,e));
  const o={};for(const k in a)o[k]=(b&&k in b)?mix(a[k],b[k],e):a[k];
  if(b)for(const k in b)if(!(k in o))o[k]=b[k];return o;
}
function poseAt(ex,p){return ex.fn?ex.fn(p):mix(ex.A,Object.assign({},ex.A,ex.B),ping(p))}
const Ln=(a,b,c,w)=>`<line x1="${n1(a[0])}" y1="${n1(a[1])}" x2="${n1(b[0])}" y2="${n1(b[1])}" class="${c}"${w?` stroke-width="${w}"`:''}/>`;
const Rc=(x,y,w,h,c,rx=2)=>`<rect x="${n1(x)}" y="${n1(y)}" width="${n1(w)}" height="${n1(h)}" rx="${rx}" class="${c}"/>`;
const Ci=(x,y,r,c)=>`<circle cx="${n1(x)}" cy="${n1(y)}" r="${r}" class="${c}"/>`;
function limb(a,L2,c){return `<polyline points="${pt(a)} ${pt(L2.j)} ${pt(L2.e)}" class="${c}"/>`}
function legS(hip,L2,toe,c){const t=nrm(toe);return `<polyline points="${pt(hip)} ${pt(L2.j)} ${pt(L2.e)} ${pt(add(L2.e,mul(t,9)))}" class="${c}"/>`}
const dbV=h=>Rc(h[0]-1.6,h[1]-10,3.2,20,'ac',1)+Rc(h[0]-5.5,h[1]-12,11,5,'ac',2)+Rc(h[0]-5.5,h[1]+7,11,5,'ac',2);
const dbH=h=>Rc(h[0]-10,h[1]-1.6,20,3.2,'ac',1)+Rc(h[0]-12,h[1]-5.5,5,11,'ac',2)+Rc(h[0]+7,h[1]-5.5,5,11,'ac',2);
const dbE=h=>Ci(h[0],h[1],6.5,'ac')+Ci(h[0],h[1],2.2,'disp');
const MAT=Rc(16,180,168,3,'mat',1.5);
function backPad(J,off,w){const bk=mul(J.n,-off);return Ln(add(J.hip,add(bk,mul(J.up,4))),add(J.sh,add(bk,mul(J.up,-6))),'pad',w||9)}
const seatAt=(J,w)=>Ln([J.hip[0]-16,J.hip[1]+10],[J.hip[0]+(w||20),J.hip[1]+10],'pad',8);

function bodySegment(a,b,wa,wb,color){
  const direction=nrm([b[0]-a[0],b[1]-a[1]]),normal=[-direction[1],direction[0]],mid=mul(add(a,b),.5);
  return `<path d="M${pt(add(a,mul(normal,wa)))} Q${pt(add(mid,mul(normal,(wa+wb)*.6)))} ${pt(add(b,mul(normal,wb)))} Q${pt(add(b,mul(direction,wb*.5)))} ${pt(add(b,mul(normal,-wb)))} Q${pt(add(mid,mul(normal,-(wa+wb)*.6)))} ${pt(add(a,mul(normal,-wa)))} Q${pt(add(a,mul(direction,-wa*.4)))} ${pt(add(a,mul(normal,wa)))}Z" fill="${color}" stroke="#526171" stroke-width=".7"/>`;
}
function humanFigure(ex,J){
  const targets=EX_TARGETS[ex.id]||[[],[]];
  const color=(regions,far=false)=>targets[0].some(x=>regions.includes(x))?(far?'#718e25':'#C8F135'):
    targets[1].some(x=>regions.includes(x))?(far?'#2c7389':'#4FC3F7'):far?'#536477':'#A4B4C6';
  const arm=(limb,far)=>bodySegment(J.sh,limb.j,5.3,3.8,color(['biceps','triceps','shoulders'],far))
    +bodySegment(limb.j,limb.e,3.8,2.4,color(['forearms'],far))+Ci(limb.e[0],limb.e[1],3,far?'human-far':'human-skin');
  const leg=(limb,toe,far)=>bodySegment(J.hip,limb.j,8,5,color(['quads','hamstrings','adductors','glutes'],far))
    +bodySegment(limb.j,limb.e,4.8,2.5,color(['calves'],far))+bodySegment(limb.e,add(limb.e,mul(nrm(toe),9)),3.5,2.8,far?'#384452':'#d4dce7');
  const waist=add(mul(add(J.hip,J.sh),.5),mul(J.n,J.curve));
  const torso=`<path d="M${pt(add(J.hip,mul(J.n,9)))} Q${pt(add(waist,mul(J.n,8)))} ${pt(add(J.sh,mul(J.n,13)))} Q${pt(add(J.sh,mul(J.up,4)))} ${pt(add(J.sh,mul(J.n,-13)))} Q${pt(add(waist,mul(J.n,-8)))} ${pt(add(J.hip,mul(J.n,-9)))}Z" fill="${color(['chest','back','abs','obliques','erectors'])}" stroke="#526171" stroke-width=".9"/>`;
  return arm(J.arm2,true)+leg(J.leg2,J.toe2,true)+torso
    +bodySegment(J.sh,J.head,3.8,3.6,'#a4b4c6')
    +`<ellipse cx="${n1(J.head[0])}" cy="${n1(J.head[1])}" rx="6.8" ry="9" fill="#bdcad8" stroke="#6d7c8d" stroke-width=".7"/>`
    +Ln(add(J.head,[2,-1]),add(J.head,[4,-1]),'face',1)+Ci(J.hip[0],J.hip[1],9,'human-shorts')
    +leg(J.leg1,J.toe,false)+arm(J.arm1,false);
}
function figSVG(ex,p){
  const J=solve(poseAt(ex,p));
  let s=`<line x1="6" y1="182.5" x2="194" y2="182.5" class="fl"/>`;
  if(ex.back)s+=ex.back(J,p);
  s+=humanFigure(ex,J);
  if(ex.front)s+=ex.front(J,p);
  return s;
}

/* ================= exercise library ================= */
const SEC={

};
const STAND={h:[100,110],t:0,foot:[103,180],foot2:[97,180],kb:[1,0]};
const EX=[
/* ---- warm-up ---- */
{id:'tread',name:'Treadmill Walk',sec:'warm',equip:'Treadmill',muscles:'Heart · legs',type:'time',dur:480,min:8,met:3.9,rx:'5 min easy + 3 min brisk',period:1150,

   return{h:[100,110-1.5*Math.abs(Math.sin(th))],t:5,handRel:[Math.sin(a)*40,Math.cos(a)*40],handRel2:[Math.sin(-a)*40,Math.cos(-a)*40],foot:ft(th),foot2:ft(th+Math.PI),kb:[1,0],eb:[-1,.3]}},
 back:(J,p)=>Rc(44,181,124,8,'e2',4)+`<line x1="50" y1="185" x2="162" y2="185" class="belt" style="stroke-dashoffset:${n1(p*22)}"/>`+Ln([162,184],[150,96],'e1',5)+Rc(134,84,32,12,'e2',3)+Rc(139,87.5,15,5,'ac',1)+Ln([152,100],[120,104],'e1',3)},
{id:'row',name:'Rowing Machine',sec:'warm',equip:'Rowing machine (erg)',muscles:'Back · legs · arms',type:'time',dur:120,min:2,met:4.8,rx:'2 min easy',period:2600,

 mistake:'Pulling with your arms before your legs finish pushing.',
 A:{h:[102,158],t:25,hand:[158,130],foot:[148,166],kb:[0,-1],eb:[0,1]},

 back:J=>Ln([26,172],[180,172],'e1',4)+Ln([38,172],[38,182],'e1',3)+Ln([168,172],[168,182],'e1',3)+Ci(172,146,15,'e2')+Ci(172,146,4,'e1')+Ln([152,146],[156,174],'e1',5)+Rc(J.hip[0]-13,J.hip[1]+4,26,7,'e2',3),
 front:J=>Ln([164,140],J.hand,'cb')+Rc(J.hand[0]-2,J.hand[1]-6,4,12,'ac',2)},

{id:'armc',name:'Arm Circles',sec:'mob',equip:'No equipment',muscles:'Shoulders · upper back',type:'time',dur:80,min:1.33,met:3.5,rx:'40 s forward + 40 s back',period:2200,

{id:'legs',name:'Leg Swings',sec:'mob',equip:'Wall or rack to hold',muscles:'Hips · hamstrings · hip flexors',type:'time',dur:80,min:1.33,met:3.5,rx:'10 swings per leg, front & back',period:1700,

 back:()=>Rc(146,36,8,146,'e2',3)},
{id:'bsq',name:'Bodyweight Squats',sec:'mob',equip:'No equipment',muscles:'Quads · glutes',type:'time',dur:80,min:1.33,met:3.5,rx:'10–15 slow reps',period:2600,

const planTimeParts=()=>{
  const list=planExercises();

  const rest=list.reduce((s,e)=>s+(e.type==='sets'?Math.max(0,e.sets-1)*(e.rest||0)/60:0),0);
  const transitions=Math.max(0,list.length-1)*0.5;
  const bySec={};for(const e of list)bySec[e.sec]=(bySec[e.sec]||0)+e.min;
  return{list,work,rest,transitions,total:work+rest+transitions,bySec};
};

const planMin=()=>planTimeParts().total;
const planKcal=()=>Math.round(planExercises().reduce((s,e)=>s+exKcal(e),0));
const secMin=k=>planExercises().filter(e=>e.sec===k).reduce((s,e)=>s+e.min,0);
const secKcal=k=>Math.round(planExercises().filter(e=>e.sec===k).reduce((s,e)=>s+exKcal(e),0));

function startW(e){const ss=setsFor(e.id);if(ss.length){const w=topW(ss[0].items[e.id]);if(w)return w}return e.w}

function streakWeeks(){if(!DB.sessions.length)return 0;let c=0;let ws=weekStart(new Date());
  const has=w=>DB.sessions.some(s=>{const d=new Date(s.date);return d>=w&&d<new Date(w.getTime()+7*864e5)});
  if(!has(ws))ws=new Date(ws.getTime()-7*864e5);while(has(ws)){c++;ws=new Date(ws.getTime()-7*864e5)}return c}

/* ================= animation loop ================= */
const LIVE=[];
const REDUCED_MOTION=window.matchMedia('(prefers-reduced-motion: reduce)');
const ANIM_VISIBILITY='IntersectionObserver'in window?new IntersectionObserver(entries=>{
  for(const entry of entries){const item=LIVE.find(x=>x.el===entry.target);if(item)item.visible=entry.isIntersecting}
},{rootMargin:'100px'}):null;
function mountAnims(root){(root||document).querySelectorAll('svg.anim:not([data-m])').forEach(el=>{
  const ex=EXI[el.dataset.ex];el.setAttribute('data-m','1');el.innerHTML=figSVG(ex,.32);
  LIVE.push({el,ex,t0:performance.now()-Math.random()*400,visible:true,player:el.closest('.demo-player')});ANIM_VISIBILITY?.observe(el);
})}
let lastFrame=0;
function frame(ts){
  if(ts-lastFrame>30){lastFrame=ts;
    for(let i=LIVE.length-1;i>=0;i--){const o=LIVE[i];if(!o.el.isConnected){ANIM_VISIBILITY?.unobserve(o.el);LIVE.splice(i,1);continue}
      if(!o.visible)continue;
      const p=o.el.dataset.paused==='1'?Number(o.el.dataset.phase||0):REDUCED_MOTION.matches ? .32 : ((ts-o.t0)%o.ex.period)/o.ex.period;
      if(o.lastPose!==p){o.el.innerHTML=figSVG(o.ex,p);o.lastPose=p;o.el.dataset.currentPhase=String(p)}
      if(o.player){const slider=o.player.querySelector('input[type="range"]');if(slider&&document.activeElement!==slider)slider.value=Math.round(p*100)}
    }}
  requestAnimationFrame(frame);
}
const animSVG=(id,cls)=>`<svg class="anim" data-ex="${id}" viewBox="0 0 200 200" role="img" aria-label="${esc(EXI[id].name)} animation"></svg>`;
const thumbSVG=e=>`<svg class="thumb anim" data-ex="${e.id}" viewBox="0 0 200 200" aria-hidden="true">${figSVG(e,.32)}</svg>`;
function demoPlayback(button){
  const svg=button.closest('.demo-player').querySelector('svg.anim'),item=LIVE.find(x=>x.el===svg);
  if(svg.dataset.paused==='1'){svg.dataset.paused='0';item.t0=performance.now()-Number(svg.dataset.phase||0)*item.ex.period;button.textContent='Pause demo'}
  else{svg.dataset.paused='1';svg.dataset.phase=svg.dataset.currentPhase||'0';button.textContent='Play demo'}
}

function parseMachineCode(raw){
  const text=String(raw||'').trim();if(!text)return null;
  const saved=DB.machineLinks.find(x=>x.code===text);
  if(saved)return MACHINES.find(m=>m.id===saved.id);
  const values=[text];try{values.push(decodeURIComponent(text))}catch(e){}
  try{
    const u=new URL(text);
    const hash=new URLSearchParams(u.hash.replace(/^#\??/,''));
    values.push(u.searchParams.get('machine')||'',u.searchParams.get('id')||'',u.searchParams.get('code')||'',
      hash.get('machine')||'',hash.get('id')||'',hash.get('code')||'',u.pathname.split('/').filter(Boolean).pop()||'');
  }
  catch(e){}
  const normalize=s=>String(s).trim().toLowerCase().replace(/^rb[-_:]/,'').replace(/[^a-z0-9]/g,'');
  const tokens=values.map(normalize).filter(Boolean);
  return MACHINES.find(m=>tokens.some(t=>t===normalize(m.id)||t===normalize(machineCode(m))||t===normalize(m.name)));
}

    status.textContent='Camera ready. Center a machine QR code in view.';
    let lastRead=0;
    const scan=async()=>{
      if(!SCAN_STREAM||SCAN_BUSY)return;
      if(performance.now()-lastRead<180||video.readyState<2){SCAN_FRAME=requestAnimationFrame(scan);return}
      lastRead=performance.now();
      SCAN_BUSY=true;
      try{
        let rawValue='';
        if(detector){const codes=await detector.detect(video);rawValue=codes[0]?.rawValue||''}
        else{
          const scale=Math.min(1,640/video.videoWidth);
          canvas.width=Math.round(video.videoWidth*scale);canvas.height=Math.round(video.videoHeight*scale);
          context.drawImage(video,0,0,canvas.width,canvas.height);
          const image=context.getImageData(0,0,canvas.width,canvas.height);
          rawValue=window.jsQR(image.data,image.width,image.height)?.data||'';
        }
        if(request!==SCAN_REQUEST)return;
        if(rawValue){
          const m=parseMachineCode(rawValue);
          if(m){status.textContent=`Found ${m.name}.`;closeScanner();openMachine(m.id,DB.machineLinks.some(x=>x.code===rawValue.trim()));return}
          showMachineMatch(rawValue);stopScan();return;
        }
      }catch(e){status.textContent='Could not read that QR. Hold it steady or use manual lookup.'}
      finally{SCAN_BUSY=false}
      if(SCAN_STREAM)SCAN_FRAME=requestAnimationFrame(scan);
    };
    SCAN_FRAME=requestAnimationFrame(scan);
  }catch(e){
    if(request!==SCAN_REQUEST)return;
    stopScan();
    status.textContent='Camera unavailable or permission denied. Search the catalogue or enter a machine name/code below.';
  }

const CH={};
function chartSVG(id,pts,o){

  const vals=pts.map(p=>+p.v||0);let mx=Math.max(...vals,1),mn=o.type==='line'?Math.min(...vals):0;
  if(o.type==='line'){const pad=(mx-mn)*.2||Math.max(1,mx*.1);mn=Math.max(0,mn-pad);mx=mx+pad}
  const step=niceStep((mx-mn)/3);mn=Math.floor(mn/step)*step;mx=Math.ceil(mx/step)*step;if(mx===mn)mx=mn+step;
  const X=i=>pts.length===1?pl+pw/2:pl+(o.type==='bar'?(i+.5)*pw/pts.length:i*pw/(pts.length-1));
  const Y=v=>pt_+ph-(v-mn)/(mx-mn)*ph;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'chart')}">`;
  for(let v=mn;v<=mx+1e-9;v+=step){const y=Y(v);s+=`<line x1="${pl}" x2="${W-pr}" y1="${n1(y)}" y2="${n1(y)}" class="gl"/><text x="${pl-6}" y="${n1(y+3.5)}" text-anchor="end" class="axl">${fmtNum(v)}</text>`}
  const lblIdx=pts.length<=6?pts.map((_,i)=>i):[0,Math.floor((pts.length-1)/2),pts.length-1];
  lblIdx.forEach(i=>s+=`<text x="${n1(X(i))}" y="${H-6}" text-anchor="middle" class="axl">${esc(pts[i].x)}</text>`);
  s+=`<line class="xh" x1="0" x2="0" y1="${pt_}" y2="${pt_+ph}" stroke="#5a6470" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>`;
  if(o.type==='bar'){const bw=Math.min(24,pw/pts.length*.62);pts.forEach((p,i)=>{const x=X(i)-bw/2,y=Y(+p.v||0),b=Y(mn),hh=Math.max(0,b-y),r=Math.min(4,hh,bw/2);
    s+=`<path d="M${n1(x)},${n1(b)} V${n1(y+r)} Q${n1(x)},${n1(y)} ${n1(x+r)},${n1(y)} H${n1(x+bw-r)} Q${n1(x+bw)},${n1(y)} ${n1(x+bw)},${n1(y+r)} V${n1(b)} Z" fill="var(--ac)"/>`})}
  else{s+=`<path d="${pts.map((p,i)=>(i?'L':'M')+n1(X(i))+','+n1(Y(+p.v||0))).join(' ')}" fill="none" stroke="var(--ac)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    pts.forEach((p,i)=>s+=`<circle cx="${n1(X(i))}" cy="${n1(Y(+p.v||0))}" r="4" fill="var(--ac)" stroke="var(--s1)" stroke-width="2"/>`)}
  s+=`</svg>`;
  CH[id]={xs:pts.map((_,i)=>X(i)),ys:pts.map(p=>Y(+p.v||0)),pts,unit:o.unit||'',W};
  return `<div class="chart" data-chart="${id}">${s}<div class="tip" hidden></div></div>`;
}
function niceStep(r){if(r<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(r)));const f=r/e;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e}

  const show=ev=>{const r=svg.getBoundingClientRect();const x=(ev.clientX-r.left)/r.width*c.W;let bi=0,bd=1e9;c.xs.forEach((v,i)=>{const d=Math.abs(v-x);if(d<bd){bd=d;bi=i}});
    const p=c.pts[bi];tip.hidden=false;tip.innerHTML=`<b>${fmtNum(+p.v)}${c.unit?' '+c.unit:''}</b>${esc(p.x)}`;
    const px=c.xs[bi]/c.W*r.width;tip.style.left=Math.max(40,Math.min(r.width-40,px))+'px';tip.style.top=Math.max(0,c.ys[bi]/c.W*r.width-52)+'px';
    xh.setAttribute('x1',c.xs[bi]);xh.setAttribute('x2',c.xs[bi]);xh.setAttribute('opacity','1')};
  const hide=()=>{tip.hidden=true;xh.setAttribute('opacity','0')};
  svg.addEventListener('pointermove',show);svg.addEventListener('pointerdown',show);svg.addEventListener('pointerleave',hide)})}

/* ================= PROGRESS ================= */
let PEX='curl';
function vProgress(){
  const S=DB.sessions;
  let h=`<header class="top"><div><div class="eyebrow">Your stats</div><h1>Progress</h1></div></header>`;
  const tot=S.reduce((a,s)=>a+s.dur,0),kc=S.reduce((a,s)=>a+s.kcal,0);
  h+=`<div class="tiles"><div class="tile"><div class="num">${S.length}</div><div class="lbl">workouts</div></div>
   <div class="tile"><div class="num">${thisWeekCount()}<span class="muted" style="font-size:20px">/${DB.profile.perWeek}</span></div><div class="lbl">this week</div></div>
   <div class="tile"><div class="num">${fmtMin(tot)}</div><div class="lbl">total time</div></div>
   <div class="tile"><div class="num">${kc.toLocaleString()}</div><div class="lbl">est. kcal burned</div></div></div>`;
  if(!S.length){h+=`<div class="card empty"><div class="fig">${animSVG('curl')}</div><b style="color:var(--tx)">No workouts yet</b><p class="small">Finish your first session and your charts, personal bests and history will show up here.</p><button class="btn" onclick="go('today');startWorkout()">Start day 1</button></div>`}
  else{
    const last=S.slice(-12);
    h+=`<div class="card"><h3>Calories per workout</h3><p class="small muted" style="margin:2px 0 8px">Estimated from time spent on each move × its MET value × your weight.</p>${chartSVG('kc',last.map(s=>({x:fmtD(s.date),v:s.kcal})),{type:'bar',unit:'kcal',label:'Calories per workout'})}</div>`;
    h+=`<div class="card"><h3>Training volume</h3><p class="small muted" style="margin:2px 0 8px">Total weight lifted (lb × reps). Rising volume means you're getting stronger.</p>${chartSVG('vol',last.map(s=>({x:fmtD(s.date),v:s.vol})),{type:'line',unit:'lb',label:'Volume per workout'})}</div>`;
    const opts=EX.filter(e=>e.type==='sets');const e=EXI[PEX];const ss=setsFor(PEX);
    h+=`<div class="card"><h3>Strength by exercise</h3><select class="field" style="margin:10px 0" onchange="PEX=this.value;render()">${opts.map(o=>`<option value="${o.id}" ${o.id===PEX?'selected':''}>${esc(o.name)}</option>`).join('')}</select>`;
    h+=ss.length?`<p class="small muted" style="margin:0 0 8px">Best: <b style="color:var(--tx)">${esc(bestSetStr(e,{sets:ss.flatMap(s=>s.items[PEX].sets)}))}</b> · logged ${ss.length}×</p>${ss.length>1?chartSVG('pe',ss.slice(-15).map(s=>({x:fmtD(s.date),v:e.w===null?topReps(s.items[PEX]):topW(s.items[PEX])})),{type:'line',unit:e.w===null?(e.unit==='sec'?'sec':'reps'):'lb'}):'<p class="small muted">Log it once more to see a trend line.</p>'}`:`<p class="small muted">No sets logged for this move yet.</p>`;
    h+=`</div>`;
  }
  h+=`<div class="card"><h3>Body weight</h3><div class="row2" style="margin:10px 0"><input class="field" id="bwIn" type="number" inputmode="decimal" step="0.1" placeholder="${DB.profile.lb} lb"><button class="btn sm" style="flex:0 0 auto;padding:0 18px" onclick="logBW()">Log</button></div>
   ${DB.bw.length>1?chartSVG('bw',DB.bw.slice(-20).map(b=>({x:fmtD(b.d),v:b.lb})),{type:'line',unit:'lb'}):`<p class="small muted" style="margin:0">Weigh in once a week, same time of day. Your weight can swing 2–4 lb from day to day, so watch the trend.</p>`}</div>`;
  if(S.length){h+=`<div class="card"><h3 style="margin-bottom:4px">History</h3>${S.slice().reverse().map(s=>`<div class="hist"><div class="h"><div><b>${fmtDL(s.date)}</b><div class="small muted">${fmtMin(s.dur)} · ~${s.kcal} kcal · ${s.sets} sets · ${s.moves} moves</div></div><button class="btn2 sm" onclick="this.closest('.hist').querySelector('.d').classList.toggle('hidden')">Details</button></div>
    <div class="d hidden">${Object.keys(s.items).map(id=>{const e=EXI[id];if(!e)return'';const it=s.items[id];return `<div>• ${esc(e.name)}: ${it.sets&&it.sets.length?it.sets.map(x=>e.w===null?x.r:(x.w+'×'+x.r)).join(', '):fmtT(it.t)}</div>`}).join('')}
    <button class="btn2 sm danger" style="margin-top:8px" onclick="delSess('${s.id}',this)">Delete workout</button></div></div>`).join('')}</div>`}
  return h;
}
function logBW(){const v=+$('#bwIn').value;if(!v||v<60||v>700){toast('Enter your weight in lb');return}DB.bw.push({d:new Date().toISOString(),lb:v});DB.profile.lb=v;save();toast('Weight logged');render()}
function delSess(id,b){if(!b.dataset.c){b.dataset.c=1;b.textContent='Tap again to delete';return}DB.sessions=DB.sessions.filter(s=>s.id!==id);save();render();toast('Workout deleted')}

/* ================= GOALS ================= */
const MS=[
 {s:0,e:2,when:'First sessions',title:'Learn your starting point',
  feel:['Choose loads you can control; the displayed starting weights are examples, not prescriptions.','Practice machine adjustments and stop for sharp pain, dizziness or unusual shortness of breath.'],
  see:'Record what you actually completed. Soreness is not a measure of a successful workout.'},
 {s:2,e:6,when:'Building the habit',title:'Repeat before adding more',
  feel:['Choose a schedule you can sustain and leave room to recover between strength sessions.','Use your logged repetitions and technique to decide when a small increase is appropriate.'],
  see:'Look for more comfortable movements, consistent attendance and improving performance rather than a fixed appearance deadline.'},
 {s:6,e:12,when:'Reviewing your routine',title:'Adapt to your progress',
  feel:['Check that your weekly routine covers the major muscle groups, even if you emphasize one area.','Adjust session length and exercise selection to your available equipment and recovery.'],
  see:'Changes in body composition and strength differ between people. Training history, nutrition, sleep and health all matter.'},
 {s:12,e:52,when:'Longer-term consistency',title:'Keep the plan sustainable',
  feel:['Progress is not always linear. Maintain comfortable technique rather than chasing automatic weekly increases.','Ask a qualified trainer to review unfamiliar or more advanced movements.'],
  see:'Use your history, charts and how you feel to guide your next step. No plan guarantees a specific result by a date.'}
];
function vGoals(){
  const wk=weeksIn(),p=DB.profile,per=+p.perWeek||3,sk=planKcal();
  const goal=JOURNEYS[DB.preferences.goal];
  const lb=+p.lb||163,proLo=Math.round(lb*.7),proHi=Math.round(lb*1);
  const done=thisWeekCount(),pct=Math.min(1,done/per),C=2*Math.PI*32;
  let h=`<header class="top"><div><div class="eyebrow">Your roadmap</div><h1>Goals</h1></div></header>
  <div class="card"><span class="chip k">${esc(goal.name)}</span><p class="small muted">${esc(goal.guide)}</p><button class="btn2 sm" onclick="go('home')">Change my direction</button></div>
  <div class="card ring"><svg viewBox="0 0 78 78"><circle cx="39" cy="39" r="32" fill="none" stroke="var(--s3)" stroke-width="8"/><circle cx="39" cy="39" r="32" fill="none" stroke="var(--ac)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${n1(C*pct)} ${n1(C)}" transform="rotate(-90 39 39)"/><text x="39" y="45" text-anchor="middle" fill="var(--tx)" font-family="Barlow Condensed" font-weight="700" font-size="20">${done}/${per}</text></svg>
   <div><b>This week's workouts</b><div class="small muted">${DB.sessions.length?`Week ${Math.floor(wk)+1} of your training · ${streakWeeks()} week streak`:'Your clock starts with your first workout.'}</div></div></div>
  <div class="card"><h3>Your estimates</h3><p class="small muted" style="margin:2px 0 4px">Based on ${lb} lb, ${p.ft}'${p.inch}" and ${per} workouts per week. <a href="#" onclick="go('profile');return false">Edit</a></p>
   <div class="kv"><div><div class="lbl">Per workout</div><div class="num">~${sk} kcal</div></div><div><div class="lbl">Per week</div><div class="num">~${(sk*per).toLocaleString()}</div></div>
   <div><div class="lbl">Per month</div><div class="num">~${Math.round(sk*per*4.33).toLocaleString()}</div></div><div><div class="lbl">Protein / day</div><div class="num">${proLo}–${proHi} g</div></div></div>
   <p class="small muted" style="margin:0">Protein is about 0.7–1 g per lb of body weight, a common range for building muscle. Calorie numbers are estimates. Real burn depends on how hard you work and how much you rest.</p></div>
  <h3 style="margin:22px 2px 14px">Practice milestones</h3><p class="small muted">Illustrative stages, not deadlines or predicted results. Move at your own pace.</p><div class="tl">`;
  MS.forEach(m=>{const st=wk>=m.e?'done':wk>=m.s?'now':'';
    h+=`<div class="ms ${st}"><div class="when">${m.when}${st==='now'?' · you are here':st==='done'?' · done':''}</div><h3>${m.title}</h3>
     <div class="small muted" style="font-weight:600;margin-top:4px">What to practice</div><ul>${m.feel.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>
     <div class="small muted" style="font-weight:600">What to keep in mind</div><ul><li>${esc(m.see)}</li></ul></div>`});
  h+=`</div><p class="small muted">Track actual progress in the Progress tab. Sleep, food, recovery and consistency matter as much as the plan.</p>
  <div class="card"><h3>Sources</h3><ul class="src">
   <li><a href="https://pacompendium.com/conditioning-exercise" target="_blank" rel="noopener">2024 Adult Compendium of Physical Activities: MET values</a></li>
   <li><a href="https://www.acefitness.org/resources/pros/expert-articles/6434/5-things-to-know-about-metabolic-equivalents/" target="_blank" rel="noopener">ACE: How METs estimate calories burned</a></li>
   <li><a href="https://www.cdc.gov/physical-activity-basics/guidelines/adults.html" target="_blank" rel="noopener">CDC: Adult physical activity guidelines</a></li>
   <li><a href="https://www.cdc.gov/physical-activity-basics/benefits/physical-activity-and-your-weight.html" target="_blank" rel="noopener">CDC: Physical activity and weight management</a></li>
   <li><a href="https://www.nsca.com/education/articles/kinetic-select/introduction-to-dynamic-warm-up/" target="_blank" rel="noopener">NSCA: Introduction to dynamic warm-ups</a></li>
   </ul></div>`;
  return h;
}

/* ================= PROFILE ================= */
function vProfile(){const p=DB.profile;const b=bmi(),r=bmr();
  return `<header class="top"><div><div class="eyebrow">About you</div><h1>Profile</h1></div></header>
  <div class="card"><h3 style="margin-bottom:12px">Body stats</h3>
   <div class="grid3"><label class="f"><span>Height (ft)</span><input class="field" id="pFt" type="number" inputmode="numeric" value="${p.ft}"></label>
   <label class="f"><span>Height (in)</span><input class="field" id="pIn" type="number" inputmode="decimal" value="${p.inch}"></label>
   <label class="f"><span>Weight (lb)</span><input class="field" id="pLb" type="number" inputmode="decimal" value="${p.lb}"></label></div>
   <div class="grid3"><label class="f"><span>Age (optional)</span><input class="field" id="pAge" type="number" inputmode="numeric" value="${p.age}" placeholder="—"></label>
   <label class="f"><span>Sex (optional)</span><select class="field" id="pSex"><option value="">—</option><option value="m" ${p.sex==='m'?'selected':''}>Male</option><option value="f" ${p.sex==='f'?'selected':''}>Female</option></select></label>
   <label class="f"><span>Workouts / week</span><select class="field" id="pPer">${[2,3,4,5].map(v=>`<option ${+p.perWeek===v?'selected':''}>${v}</option>`).join('')}</select></label></div>
   <button class="btn" onclick="saveProfile()">Save</button></div>
  <div class="card"><h3>Your numbers</h3><div class="kv">
   <div><div class="lbl">BMI</div><div class="num">${b.toFixed(1)}</div><div class="lbl">${bmiCat(b)}</div></div>
   <div><div class="lbl">Burn per 60-min session</div><div class="num">~${planKcal()} kcal</div></div>
   <div><div class="lbl">Resting burn (BMR)</div><div class="num">${r?r.toLocaleString()+' kcal':'—'}</div><div class="lbl">${r?'per day':'add age & sex'}</div></div>
   <div><div class="lbl">Maintenance (training ${p.perWeek}×/wk)</div><div class="num">${r?Math.round(r*(+p.perWeek>=4?1.55:1.465)).toLocaleString()+' kcal':'—'}</div><div class="lbl">${r?'per day, estimate':'add age & sex'}</div></div></div>
   <p class="small muted" style="margin:0"><b>How calories are estimated:</b> kcal per minute = MET × 3.5 × body weight (kg) ÷ 200, where MET values come from the Compendium of Physical Activities (for example, weight training with 8–15 reps = 3.5; squats and deadlifts = 5.0; stretching = 2.3). Height doesn't change the workout burn. It's used for BMI and resting burn (Mifflin-St Jeor). BMI doesn't account for muscle, so expect it to rise a bit as you build muscle.</p></div>
  <div class="card"><h3>Back up your data</h3><p class="small muted" style="margin:4px 0 10px">Your workouts are saved on this device, in this browser. Copy a backup now and then (for example into Notes) so you can restore it on another phone.</p>
   <div class="row2"><button class="btn2" onclick="copyBackup()">Copy backup</button><button class="btn2" onclick="$('#restoreBox').classList.toggle('hidden')">Restore</button></div>
   <div id="restoreBox" class="hidden" style="margin-top:10px"><textarea class="field" id="restoreTxt" placeholder="Paste your backup here"></textarea><button class="btn sm" style="margin-top:8px" onclick="restoreBackup()">Restore backup</button></div>
   <textarea class="field hidden" id="backupOut" readonly style="margin-top:10px"></textarea>
   <button class="btn2 sm danger" style="margin-top:14px" onclick="resetAll(this)">Reset all data</button></div>
  <p class="small muted" style="text-align:center">Rebuild · made for your comeback 💪<br>Not medical advice. Check with a doctor if you have injuries or health conditions.</p>`}
function saveProfile(){const p=DB.profile;const ft=+$('#pFt').value,inch=+$('#pIn').value,lb=+$('#pLb').value;
  if(!(ft>=3&&ft<=8)||!(inch>=0&&inch<12)||!(lb>=60&&lb<=700)){toast('Check your height and weight');return}
  const changedW=lb!==+p.lb;Object.assign(p,{ft,inch,lb,age:$('#pAge').value?+$('#pAge').value:'',sex:$('#pSex').value,perWeek:+$('#pPer').value,set:true});
  if(changedW||!DB.bw.length)DB.bw.push({d:new Date().toISOString(),lb});save();toast('Saved. Estimates updated');render()}
function copyBackup(){const txt=JSON.stringify(DB);const o=$('#backupOut');o.value=txt;o.classList.remove('hidden');
  try{navigator.clipboard.writeText(txt).then(()=>toast('Backup copied'),()=>{o.select();toast('Select & copy the text below')})}catch(e){o.select();toast('Select & copy the text below')}}
function restoreBackup(){
  const previous=DB,previousDraft=DRAFT;
  try{const d=JSON.parse($('#restoreTxt').value);if(!d||!Array.isArray(d.sessions))throw new Error('Invalid backup');DB=Object.assign({profile:DB.profile,sessions:[],bw:[]},d);DB.profile=Object.assign({ft:5,inch:8,lb:163,age:'',sex:'',perWeek:3,set:false},DB.profile||{});DB.sessions=Array.isArray(DB.sessions)?DB.sessions:[];DB.bw=Array.isArray(DB.bw)?DB.bw:[];normalizePlan();normalizePreferences();normalizePlanner();if(!save()){DB=previous;normalizePlanner();return}PLANNER_ERROR='';toast('Backup restored');render()}
  catch(e){DB=previous;DRAFT=previousDraft;toast('That backup text or its workout settings are not valid')}
}
function resetAll(b){if(!b.dataset.c){b.dataset.c=1;b.textContent='Tap again to erase everything';return}DB={profile:{ft:5,inch:8,lb:163,age:'',sex:'',perWeek:3,set:false},sessions:[],bw:[],plan:{duration:60,selected:DEFAULT_PLAN_IDS.slice()}};normalizePreferences();normalizePlanner();PLANNER_ERROR='';ACTIVE=null;save();saveA();VIEW='home';render();toast('All data erased')}

</script>
<script src="assets/planner.js"></script>
<script>
/* ================= boot ================= */
try{normalizePlanner()}catch(error){PLANNER_ERROR=error.message;console.error(error);toast('Planner data could not be loaded. Existing tracking data is kept; restore a valid backup in Profile')}
render();requestAnimationFrame(frame);
if(!TICK)TICK=setInterval(tickWO,250);
if(location.hash==='#workout'&&ACTIVE)openWO();
</script>
</body>
