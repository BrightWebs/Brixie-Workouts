<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rebuild — Gym Comeback Tracker</title>
<meta name="description" content="Full-body gym comeback plan with animated exercise guides, workout logging, calorie estimates and progress goals.">
<meta name="theme-color" content="#0B0D10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rebuild">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0D10;--s1:#14171C;--s2:#1B1F25;--s3:#242930;--ln:#2A3038;
  --tx:#F3F5F7;--mu:#A0A8B3;--mu2:#6F7884;
  --ac:#C8F135;--ink:#0B0D10;
  --warm:#FF9F43;--mob:#4FC3F7;--str:#C8F135;--cool:#B79CFF;--bad:#FF6B6B;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--ac)}
.app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 100px)}
h1,h2,h3,.num{font-family:"Barlow Condensed",Inter,sans-serif;font-weight:700;letter-spacing:.3px;margin:0}
h1{font-size:34px;line-height:1}
h2{font-size:26px;line-height:1.05}
h3{font-size:19px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.9px;text-transform:uppercase;color:var(--mu)}
.muted{color:var(--mu)}
.small{font-size:13px}
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 18px}
.avatar{width:42px;height:42px;border-radius:50%;border:1px solid var(--ln);background:var(--s2);display:grid;place-items:center;color:var(--mu)}
.avatar svg{width:22px;height:22px}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:var(--r);padding:16px;margin:0 0 14px}
.hero{background:linear-gradient(150deg,#1d2410 0%,#151a10 35%,var(--s1) 75%);border:1px solid #33401a;border-radius:22px;padding:18px;margin-bottom:22px;position:relative;overflow:hidden}
.hero .fig{position:absolute;right:-6px;top:-8px;width:118px;height:118px;opacity:.95;background:none}
.hero .stats3{position:relative;z-index:1}
.hero h2{font-size:30px;max-width:62%}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.stat{background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:10px 12px}
.stat .num{font-size:26px;line-height:1}
.stat .lbl{font-size:11.5px;color:var(--mu);margin-top:3px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;background:var(--ac);color:var(--ink);font-weight:700;font-size:16px;padding:15px 18px}
.btn:active{transform:scale(.985)}
.btn2{display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--ln);border-radius:14px;background:var(--s2);color:var(--tx);font-weight:600;padding:13px 16px}
.btn2.sm,.btn.sm{padding:9px 12px;font-size:14px;border-radius:11px;width:auto}
.danger{color:var(--bad)}
.row2{display:flex;gap:10px}
.row2>*{flex:1}
.banner{display:flex;gap:12px;align-items:center;background:#1a2230;border:1px solid #2b3a52;border-radius:16px;padding:12px 14px;margin-bottom:14px;width:100%;text-align:left;color:var(--tx)}
.banner b{display:block}
.sech{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 10px}
.sech .t{display:flex;align-items:center;gap:9px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.sech h3{font-size:20px}
.sech .m{font-size:12.5px;color:var(--mu)}
.secdesc{font-size:13px;color:var(--mu);margin:-6px 2px 10px 21px}
.list{background:var(--s1);border:1px solid var(--ln);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;background:none;border:0;border-bottom:1px solid var(--ln);text-align:left;color:var(--tx)}
.item:last-child{border-bottom:0}
.item:active{background:var(--s2)}
.thumb{width:54px;height:54px;flex:none;border-radius:12px;background:var(--s2)}
.item .rt{flex:1;min-width:0}
.item .rn{font-weight:600}
.item .rs{font-size:12.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .rr{font-size:12px;color:var(--mu);text-align:right;flex:none}
.item .rr b{display:block;color:var(--tx);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font-size:12px;font-weight:600;border-radius:999px;padding:5px 10px;background:var(--s3);color:var(--tx)}
.chip.k{background:rgba(200,241,53,.14);color:var(--ac)}
.fig{background:radial-gradient(circle at 50% 38%,#1f242c 0%,#14171c 70%);border-radius:16px}
.fig svg{display:block;width:100%;height:100%}
.fl{stroke:#2F3640;stroke-width:1.5}
.near{stroke:#EEF1F4;stroke-width:7.5;stroke-linecap:round;stroke-linejoin:round;fill:none}
.far{stroke:#5F6977;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;fill:none}
.tor{stroke:#EEF1F4;stroke-width:11;stroke-linecap:round;fill:none}
.hd{fill:#EEF1F4}
.e1{stroke:#3C444F;stroke-linecap:round;fill:none}
.e2{fill:#262C35;stroke:#3C444F;stroke-width:1.5}
.e3{stroke:#5A6470;stroke-linecap:round;fill:none}
.pad{stroke:#323A45;stroke-linecap:round;fill:none}
.ac{fill:var(--ac)}
.acs{stroke:var(--ac);stroke-linecap:round;stroke-linejoin:round;fill:none}
.cb{stroke:#97A1AD;stroke-width:1.4}
.belt{stroke:#56606C;stroke-width:2;stroke-dasharray:5 6}
.mat{fill:#1E2B33}
.disp{fill:#0f1a05}
/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);animation:fade .18s}
.sheet .pnl{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--s1);border:1px solid var(--ln);border-bottom:0;border-radius:24px 24px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 22px);animation:up .24s cubic-bezier(.2,.8,.2,1)}
.grab{width:42px;height:5px;border-radius:3px;background:var(--s3);margin:2px auto 10px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.x{position:sticky;top:0;float:right;width:34px;height:34px;border-radius:50%;border:0;background:var(--s3);color:var(--tx);font-size:18px;line-height:34px;z-index:2}
.bigfig{height:250px;margin:6px 0 12px}
ul.cues{margin:8px 0 0;padding-left:20px}
ul.cues li{margin:5px 0}
.warn{background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.25);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:10px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.kv>div{background:var(--s2);border-radius:12px;padding:10px 12px}
.kv .num{font-size:22px}
.kv .lbl{font-size:12px;color:var(--mu)}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(12,14,17,.9);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--ln);padding:6px 8px calc(env(safe-area-inset-bottom) + 6px)}
nav.tabs .in{display:flex;max-width:560px;margin:0 auto}
nav.tabs button{flex:1;background:none;border:0;color:var(--mu2);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0}
nav.tabs button.on{color:var(--ac)}
nav.tabs svg{width:24px;height:24px}
.resume{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 70px);z-index:31;border:0;border-radius:999px;background:var(--ac);color:var(--ink);font-weight:700;padding:11px 18px;box-shadow:0 8px 30px rgba(0,0,0,.5);display:flex;gap:8px;align-items:center}
/* workout */
.wo{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch}
.wo .wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 120px)}
.wohead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.clock{font-family:"Barlow Condensed";font-weight:700;font-size:24px;letter-spacing:.5px}
.clock small{font-family:Inter;font-weight:500;font-size:12px;color:var(--mu);display:block;text-align:center;letter-spacing:0;margin-top:-2px}
.ic{width:40px;height:40px;border-radius:12px;border:1px solid var(--ln);background:var(--s2);display:grid;place-items:center;color:var(--tx)}
.ic svg{width:20px;height:20px}
.pill{border:0;border-radius:12px;background:var(--ac);color:var(--ink);font-weight:700;padding:10px 14px}
.seg{display:flex;gap:3px;margin:14px 0 10px}
.seg i{flex:1;height:5px;border-radius:3px;background:var(--s3)}
.seg i.d{background:var(--c);opacity:.55}
.seg i.c{background:var(--c);opacity:1;box-shadow:0 0 0 1px var(--c)}
.wofig{height:min(42vh,300px);margin:6px 0 12px}
details.how{background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:11px 14px;margin:10px 0 14px}
details.how summary{font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.how summary::-webkit-details-marker{display:none}
details.how summary:after{content:"+";color:var(--mu)}
details[open].how summary:after{content:"–"}
.cd{font-size:72px;text-align:center;line-height:1;margin:6px 0 4px}
.bar{height:6px;border-radius:3px;background:var(--s3);overflow:hidden;margin:6px 0 14px}
.bar>i{display:block;height:100%;background:var(--ac);border-radius:3px}
table.sets{width:100%;border-collapse:separate;border-spacing:0 6px}
table.sets th{font-size:11.5px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.6px;text-align:center;padding:0 2px}
table.sets td{text-align:center;padding:0 2px}
table.sets tr.d td{background:rgba(200,241,53,.08)}
table.sets td:first-child{border-radius:10px 0 0 10px;font-weight:700;width:34px}
table.sets td:last-child{border-radius:0 10px 10px 0;width:48px}
table.sets td.prev{color:var(--mu);font-size:13px}
.inp{width:100%;max-width:84px;text-align:center;background:var(--s2);border:1px solid var(--ln);border-radius:10px;padding:10px 4px;font-weight:600;font-size:16px}
.inp:focus{outline:2px solid var(--ac);border-color:transparent}
.chk{width:40px;height:40px;border-radius:10px;border:1px solid var(--ln);background:var(--s2);display:grid;place-items:center;color:var(--mu)}
tr.d .chk{background:var(--ac);border-color:var(--ac);color:var(--ink)}
.chk svg{width:20px;height:20px}
.wonav{position:fixed;left:0;right:0;bottom:0;z-index:41;background:linear-gradient(to top,var(--bg) 70%,rgba(11,13,16,0));padding:20px 16px calc(env(safe-area-inset-bottom) + 12px)}
.wonav .in{max-width:528px;margin:0 auto;display:flex;gap:10px}
.wonav .btn2{flex:0 0 34%}
.rest{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 84px);z-index:42;max-width:536px;margin:0 auto;background:#1c2410;border:1px solid #3c4d17;border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.rest .num{font-size:30px;color:var(--ac);min-width:62px}
.rest .grow{flex:1;font-size:13px;color:var(--mu)}
.rest button{border:0;border-radius:10px;background:rgba(255,255,255,.08);padding:8px 10px;font-weight:600}
.hidden{display:none!important}
/* forms */
label.f{display:block;margin:0 0 12px}
label.f span{display:block;font-size:12.5px;color:var(--mu);margin-bottom:5px;font-weight:600}
.field{width:100%;background:var(--s2);border:1px solid var(--ln);border-radius:12px;padding:12px;font-size:16px}
.field:focus{outline:2px solid var(--ac);border-color:transparent}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
textarea.field{min-height:90px;font-size:12px;font-family:ui-monospace,Menlo,monospace}
/* charts */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y}
.gl{stroke:#232830;stroke-width:1}
.axl{fill:#7A838F;font-size:10px;font-family:Inter}
.tip{position:absolute;top:0;pointer-events:none;background:#0b0d10;border:1px solid var(--ln);border-radius:10px;padding:6px 9px;font-size:12px;white-space:nowrap;transform:translateX(-50%);box-shadow:0 6px 18px rgba(0,0,0,.5)}
.tip b{display:block;font-size:14px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tile{background:var(--s1);border:1px solid var(--ln);border-radius:16px;padding:14px}
.tile .num{font-size:32px;line-height:1}
.tile .lbl{font-size:12.5px;color:var(--mu);margin-top:4px}
.empty{text-align:center;padding:26px 14px;color:var(--mu)}
.empty .fig{width:120px;height:120px;margin:0 auto 10px}
.hist{border-top:1px solid var(--ln);padding:12px 0}
.hist:first-of-type{border-top:0}
.hist .h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hist .d{font-size:12.5px;color:var(--mu);margin-top:6px}
select.field{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,#8a94a0 50%),linear-gradient(135deg,#8a94a0 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
/* goals */
.tl{position:relative;margin-left:8px;padding-left:22px;border-left:2px solid var(--ln)}
.ms{position:relative;margin:0 0 18px}
.ms:before{content:"";position:absolute;left:-30px;top:4px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--mu2)}
.ms.done:before{background:var(--ac);border-color:var(--ac)}
.ms.now:before{background:var(--bg);border-color:var(--ac);box-shadow:0 0 0 5px rgba(200,241,53,.18)}
.ms .when{font-size:12px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--mu)}
.ms.now .when{color:var(--ac)}
.ms h3{margin:2px 0 6px}
.ms ul{margin:6px 0;padding-left:18px;font-size:14px}
.ms li{margin:3px 0}
.tgt{display:grid;grid-template-columns:1fr auto;gap:4px 12px;background:var(--s1);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:8px}
.tgt .v{font-weight:700;text-align:right}
.ring{display:flex;align-items:center;gap:14px}
.ring svg{width:78px;height:78px;flex:none}
.src li{margin:6px 0;font-size:13.5px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translateX(-50%);z-index:60;background:#20261a;border:1px solid #3c4d17;color:var(--tx);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;animation:fade .2s}
.pr{display:inline-block;background:var(--ac);color:var(--ink);font-weight:800;font-size:11px;border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:2px}
@media (min-width:600px){.app{padding-top:28px}}
</style>
</head>
<body>
<div class="app" id="view"></div>
<button class="resume hidden" id="resumeBtn" onclick="openWO()"></button>
<nav class="tabs"><div class="in" id="tabs"></div></nav>
<div id="woRoot"></div>
<div id="sheetRoot"></div>
<script>
"use strict";
/* ================= storage ================= */
const KEY='rebuild.v1', AKEY='rebuild.active';
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
let DB=store.get(KEY,null)||{profile:{ft:5,inch:8,lb:163,age:'',sex:'',perWeek:3,set:false},sessions:[],bw:[]};
DB.profile=Object.assign({ft:5,inch:8,lb:163,age:'',sex:'',perWeek:3,set:false},DB.profile||{});
DB.sessions=DB.sessions||[];DB.bw=DB.bw||[];
let ACTIVE=store.get(AKEY,null);
function save(){store.set(KEY,DB)}
function saveA(){ACTIVE?store.set(AKEY,ACTIVE):store.del(AKEY)}

/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const n1=v=>(+v).toFixed(1);
const pt=p=>n1(p[0])+","+n1(p[1]);
const add=(a,b)=>[a[0]+b[0],a[1]+b[1]];
const mul=(a,k)=>[a[0]*k,a[1]*k];
const nrm=a=>{const d=Math.hypot(a[0],a[1])||1;return[a[0]/d,a[1]/d]};
const ping=p=>(1-Math.cos(2*Math.PI*p))/2;
const D2R=Math.PI/180;
function fmtT(sec){sec=Math.max(0,Math.round(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`}
function fmtMin(sec){const m=Math.round(sec/60);return m<60?`${m} min`:`${Math.floor(m/60)}h ${m%60}m`}
const fmtD=iso=>new Date(iso).toLocaleDateString(undefined,{month:'short',day:'numeric'});
const fmtDL=iso=>new Date(iso).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
const round5=v=>Math.max(5,Math.round(v/5)*5);
const round25=v=>Math.max(2.5,Math.round(v/2.5)*2.5);

/* ================= figure engine ================= */
const L={torso:46,ua:26,fa:24,th:36,sh:36,neck:14,head:9};
function ik(a,b,l1,l2,pref){
  let dx=b[0]-a[0],dy=b[1]-a[1];let d=Math.hypot(dx,dy);
  if(d<1){dx=0;dy=1;d=1}
  const max=l1+l2-0.4;
  if(d>=max){const u=[dx/d,dy/d];return{j:add(a,mul(u,l1)),e:add(a,mul(u,max))}}
  const dd=Math.max(d,Math.abs(l1-l2)+0.5);
  const base=Math.atan2(dy,dx);
  const al=Math.acos(Math.max(-1,Math.min(1,(l1*l1+dd*dd-l2*l2)/(2*l1*dd))));
  const j1=[a[0]+l1*Math.cos(base+al),a[1]+l1*Math.sin(base+al)];
  const j2=[a[0]+l1*Math.cos(base-al),a[1]+l1*Math.sin(base-al)];
  const m=[(a[0]+b[0])/2,(a[1]+b[1])/2];
  const s1=(j1[0]-m[0])*pref[0]+(j1[1]-m[1])*pref[1];
  const s2=(j2[0]-m[0])*pref[0]+(j2[1]-m[1])*pref[1];
  return{j:s1>=s2?j1:j2,e:b};
}
function solve(P){
  const t=P.t*D2R;const up=[Math.sin(t),-Math.cos(t)];const n=[Math.cos(t),Math.sin(t)];
  const hip=P.h;const sh=add(hip,mul(up,L.torso));
  const ht=t+(P.ht||0)*D2R;const head=add(sh,[Math.sin(ht)*L.neck,-Math.cos(ht)*L.neck]);
  const hand=P.hand||add(sh,P.handRel||[0,46]);
  const hand2=P.hand2||(P.handRel2?add(sh,P.handRel2):hand);
  const eb=nrm(P.eb||[0,1]),eb2=nrm(P.eb2||P.eb||[0,1]);
  const kb=nrm(P.kb||[1,0]),kb2=nrm(P.kb2||P.kb||[1,0]);
  const arm1=ik(sh,hand,L.ua,L.fa,eb),arm2=ik(sh,hand2,L.ua,L.fa,eb2);
  const leg1=ik(hip,P.foot,L.th,L.sh,kb),leg2=ik(hip,P.foot2||P.foot,L.th,L.sh,kb2);

/* ================= calories & profile math ================= */
const kg=()=>(+DB.profile.lb||163)*0.4536;
const cm=()=>((+DB.profile.ft||5)*12+(+DB.profile.inch||0))*2.54;
const kcalMin=met=>met*3.5*kg()/200;            // ACE / Compendium formula
const exKcal=e=>e.min*kcalMin(e.met);
const planMin=()=>EX.reduce((s,e)=>s+e.min,0);
const planKcal=()=>Math.round(EX.reduce((s,e)=>s+exKcal(e),0));
const secMin=k=>EX.filter(e=>e.sec===k).reduce((s,e)=>s+e.min,0);
const secKcal=k=>Math.round(EX.filter(e=>e.sec===k).reduce((s,e)=>s+exKcal(e),0));
function bmi(){const m=cm()/100;return kg()/(m*m)}
function bmiCat(b){return b<18.5?'Underweight':b<25?'Healthy range':b<30?'Overweight range':'Obese range'}
function bmr(){const p=DB.profile;if(!p.age||!p.sex)return null;const base=10*kg()+6.25*cm()-5*(+p.age);return Math.round(p.sex==='m'?base+5:base-161)}

/* ================= history helpers ================= */
function setsFor(id){return DB.sessions.filter(s=>s.items&&s.items[id]&&s.items[id].sets&&s.items[id].sets.length)}
function lastFor(id){const ss=setsFor(id);return ss.length?ss[ss.length-1].items[id]:null}
function topW(it){return it&&it.sets?Math.max(0,...it.sets.map(x=>+x.w||0)):0}
function topReps(it){return it&&it.sets?Math.max(0,...it.sets.map(x=>+x.r||0)):0}
function bestSetStr(e,it){if(!it||!it.sets||!it.sets.length)return'';const b=it.sets.slice().sort((a,c)=>(+c.w||0)-(+a.w||0)||(+c.r||0)-(+a.r||0))[0];
  return e.w===null?`${b.r} ${e.unit==='sec'?'sec':'reps'}`:`${b.w} lb × ${b.r}`}
function startW(e){const ss=setsFor(e.id);if(ss.length){const w=topW(ss[0].items[e.id]);if(w)return w}return e.id==='curl'?25:e.w}
function suggestW(e){if(e.w===null)return'';const l=lastFor(e.id);const w=topW(l);return w||e.w}
const firstNum=s=>parseInt(String(s),10)||10;
function weeksIn(){if(!DB.sessions.length)return 0;const f=new Date(DB.sessions[0].date);return Math.max(0,(Date.now()-f)/(7*864e5))}
function weekStart(d){const x=new Date(d);x.setHours(0,0,0,0);const dw=(x.getDay()+6)%7;x.setDate(x.getDate()-dw);return x}
function thisWeekCount(){const ws=weekStart(new Date());return DB.sessions.filter(s=>new Date(s.date)>=ws).length}
function streakWeeks(){if(!DB.sessions.length)return 0;let c=0;let ws=weekStart(new Date());
  const has=w=>DB.sessions.some(s=>{const d=new Date(s.date);return d>=w&&d<new Date(w.getTime()+7*864e5)});
  if(!has(ws))ws=new Date(ws.getTime()-7*864e5);while(has(ws)){c++;ws=new Date(ws.getTime()-7*864e5)}return c}

/* ================= animation loop ================= */
const LIVE=[];
function mountAnims(root){(root||document).querySelectorAll('svg.anim:not([data-m])').forEach(el=>{el.setAttribute('data-m','1');LIVE.push({el,ex:EXI[el.dataset.ex],t0:performance.now()-Math.random()*400})})}
let lastFrame=0;
function frame(ts){
  if(ts-lastFrame>30){lastFrame=ts;
    for(let i=LIVE.length-1;i>=0;i--){const o=LIVE[i];if(!o.el.isConnected){LIVE.splice(i,1);continue}
      const p=((ts-o.t0)%o.ex.period)/o.ex.period;o.el.innerHTML=figSVG(o.ex,p)}}
  requestAnimationFrame(frame);
}
const animSVG=(id,cls)=>`<svg class="anim" data-ex="${id}" viewBox="0 0 200 200" role="img" aria-label="${esc(EXI[id].name)} animation"></svg>`;
const thumbSVG=e=>`<svg class="thumb" viewBox="0 0 200 200" aria-hidden="true">${figSVG(e,.32)}</svg>`;

/* ================= workout mode ================= */
let WO_OPEN=false,WL=null,AC=null,TICK=null;
function unlockAudio(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
function beep(n){try{if(!AC)return;let t=AC.currentTime;for(let i=0;i<(n||2);i++){const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=i===(n||2)-1?1175:880;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.3,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.22);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.25);t+=.3}}catch(e){}}
async function wake(){try{if(navigator.wakeLock)WL=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&WO_OPEN)wake()});
function newActive(){return{start:Date.now(),idx:0,enter:Date.now(),restEnd:0,restTotal:0,
  items:EX.map(e=>({id:e.id,t:0,done:false,beeped:false,rem:e.dur||0,endAt:0,
    sets:e.type==='sets'?Array.from({length:e.sets},()=>({w:suggestW(e),r:firstNum(e.reps),done:false})):null}))}}
function startWorkout(){unlockAudio();if(!ACTIVE){ACTIVE=newActive();saveA()}openWO()}
function openWO(){unlockAudio();WO_OPEN=true;renderWO();wake();if(!TICK)TICK=setInterval(tickWO,250);$('#resumeBtn').classList.add('hidden')}
function minimizeWO(){WO_OPEN=false;$('#woRoot').innerHTML='';try{WL&&WL.release()}catch(e){}render()}
function accrue(){if(!ACTIVE)return;const now=Date.now();ACTIVE.items[ACTIVE.idx].t+=Math.min((now-ACTIVE.enter)/1000,1200);ACTIVE.enter=now}
function setIdx(i){if(!ACTIVE)return;i=Math.max(0,Math.min(EX.length-1,i));accrue();ACTIVE.idx=i;saveA();renderWO();$('.wo').scrollTo(0,0)}
function woNext(){const it=ACTIVE.items[ACTIVE.idx];if(EXI[it.id].type==='time'&&it.endAt){it.rem=Math.max(0,(it.endAt-Date.now())/1000);it.endAt=0}
  it.done=it.done||EXI[it.id].type==='time'||(it.sets&&it.sets.some(s=>s.done));
  if(ACTIVE.idx>=EX.length-1){askFinish();return}setIdx(ACTIVE.idx+1)}
function woPrev(){setIdx(ACTIVE.idx-1)}
function toggleTimer(){unlockAudio();const it=ACTIVE.items[ACTIVE.idx];
  if(it.endAt){it.rem=Math.max(0,(it.endAt-Date.now())/1000);it.endAt=0}else{if(it.rem<=0.5){it.rem=EXI[it.id].dur;it.beeped=false}it.endAt=Date.now()+it.rem*1000}
  saveA();renderWO()}
function resetTimer(){const it=ACTIVE.items[ACTIVE.idx];it.endAt=0;it.rem=EXI[it.id].dur;it.beeped=false;saveA();renderWO()}
function setVal(si,k,v){const it=ACTIVE.items[ACTIVE.idx];it.sets[si][k]=v===''?'':+v;saveA()}
function toggleSet(si){unlockAudio();const it=ACTIVE.items[ACTIVE.idx];const e=EXI[it.id];const s=it.sets[si];s.done=!s.done;
  if(s.done){it.done=true;if(si<it.sets.length-1||ACTIVE.idx<EX.length-1){ACTIVE.restEnd=Date.now()+e.rest*1000;ACTIVE.restTotal=e.rest;ACTIVE.restBeeped=false}}
  saveA();renderWO()}
function addSet(){const it=ACTIVE.items[ACTIVE.idx];const l=it.sets[it.sets.length-1]||{w:'',r:10};it.sets.push({w:l.w,r:l.r,done:false});saveA();renderWO()}
function rmSet(){const it=ACTIVE.items[ACTIVE.idx];if(it.sets.length>1)it.sets.pop();saveA();renderWO()}
function restAdj(d){if(!ACTIVE.restEnd)return;ACTIVE.restEnd+=d*1000;ACTIVE.restTotal+=d;saveA();tickWO()}
function restSkip(){ACTIVE.restEnd=0;saveA();tickWO()}
function prevSets(id){const l=lastFor(id);return l?l.sets:[]}
function renderWO(){
  if(!ACTIVE){$('#woRoot').innerHTML='';return}
  const it=ACTIVE.items[ACTIVE.idx],e=EXI[it.id],sc=SEC[e.sec];

  }else{
    const pv=prevSets(e.id);const bw=e.w===null;const ul=e.unit==='sec'?'Sec':e.unit==='reps/side'?'Reps/side':'Reps';
    panel=`<div class="card" style="padding:12px 12px 8px">${e.note?`<p class="small" style="margin:0 2px 8px;color:var(--ac)">💡 ${esc(e.note)}</p>`:''}<table class="sets"><thead><tr><th>Set</th><th>Last time</th><th>${bw?'Load':'lb'}</th><th>${ul}</th><th></th></tr></thead><tbody>${it.sets.map((s,i)=>{const p=pv[i];
      return `<tr class="${s.done?'d':''}"><td>${i+1}</td><td class="prev">${p?(bw?p.r:(p.w+'×'+p.r)):'—'}</td>
      <td>${bw?'<span class="muted small">BW</span>':`<input class="inp" type="number" inputmode="decimal" step="2.5" min="0" value="${s.w}" onchange="setVal(${i},'w',this.value)" aria-label="Weight set ${i+1}">`}</td>
      <td><input class="inp" type="number" inputmode="numeric" min="0" value="${s.r}" onchange="setVal(${i},'r',this.value)" aria-label="${ul} set ${i+1}"></td>
      <td><button class="chk" onclick="toggleSet(${i})" aria-label="Complete set ${i+1}">${IC.check}</button></td></tr>`}).join('')}</tbody></table>
      <div class="row2" style="margin:4px 0 6px"><button class="btn2 sm" onclick="addSet()">+ Add set</button><button class="btn2 sm" onclick="rmSet()">− Remove set</button></div>
      <p class="small muted" style="margin:6px 2px 4px">Target ${esc(rxStr(e))} · rest ${e.rest}s. Tap ✓ after each set to start the rest timer.</p></div>`;
  }
  $('#woRoot').innerHTML=`<div class="wo"><div class="wrap">
   <div class="wohead"><button class="ic" onclick="minimizeWO()" aria-label="Minimize workout">${IC.down}</button>
    <div class="clock"><span id="woClock">${fmtT((Date.now()-ACTIVE.start)/1000)}</span><small id="woKcal">~${Math.round(liveKcal())} kcal</small></div>
    <button class="pill" onclick="askFinish()">Finish</button></div>
   <div class="seg">${ACTIVE.items.map((x,i)=>`<i class="${x.done?'d':''} ${i===ACTIVE.idx?'c':''}" style="--c:${SEC[EXI[x.id].sec].c}" onclick="setIdx(${i})"></i>`).join('')}</div>
   <div class="eyebrow" style="color:${sc.c}">${sc.name} · ${ACTIVE.idx+1} of ${EX.length}</div>
   <div class="fig wofig">${animSVG(e.id)}</div>
   <h2>${esc(e.name)}</h2>
   <div class="chips"><span class="chip k">${esc(e.equip)}</span><span class="chip">${esc(e.muscles)}</span></div>
   <details class="how"><summary>How to do it</summary><ul class="cues">${e.cues.map(c=>`<li>${esc(c)}</li>`).join('')}</ul><div class="warn"><b>Avoid:</b> ${esc(e.mistake)}</div></details>
   ${panel}
   ${ACTIVE.idx<EX.length-1?`<p class="small muted" style="margin:4px 2px">Up next: <b style="color:var(--tx)">${esc(EX[ACTIVE.idx+1].name)}</b></p>`:''}
  </div>
  <div class="rest hidden" id="rest"><div class="num" id="restT">0:00</div><div class="grow">Rest<br><span id="restN"></span></div><button onclick="restAdj(-15)">−15</button><button onclick="restAdj(15)">+15</button><button onclick="restSkip()">Skip</button></div>
  <div class="wonav"><div class="in"><button class="btn2" onclick="woPrev()" ${ACTIVE.idx===0?'disabled style="opacity:.4"':''}>← Back</button><button class="btn" onclick="woNext()">${ACTIVE.idx<EX.length-1?'Next move →':'Finish workout ✓'}</button></div></div></div>`;
  mountAnims($('#woRoot'));tickWO();
}
function liveKcal(){if(!ACTIVE)return 0;let s=0;ACTIVE.items.forEach((x,i)=>{let t=x.t;if(i===ACTIVE.idx)t+=Math.min((Date.now()-ACTIVE.enter)/1000,1200);s+=t/60*kcalMin(EXI[x.id].met)});return s}
function tickWO(){
  if(!ACTIVE)return;const now=Date.now();
  const rb=$('#rbT');if(rb)rb.textContent=fmtT((now-ACTIVE.start)/1000);
  if(!WO_OPEN)return;
  const c=$('#woClock');if(c)c.textContent=fmtT((now-ACTIVE.start)/1000);
  const k=$('#woKcal');if(k)k.textContent='~'+Math.round(liveKcal())+' kcal';
  const it=ACTIVE.items[ACTIVE.idx],e=EXI[it.id];

/* ================= charts ================= */
const CH={};
function chartSVG(id,pts,o){
  o=o||{};const W=340,H=170,pl=36,pr=12,pt_=14,pb=24;const pw=W-pl-pr,ph=H-pt_-pb;
  const vals=pts.map(p=>+p.v||0);let mx=Math.max(...vals,1),mn=o.type==='line'?Math.min(...vals):0;
  if(o.type==='line'){const pad=(mx-mn)*.2||Math.max(1,mx*.1);mn=Math.max(0,mn-pad);mx=mx+pad}
  const step=niceStep((mx-mn)/3);mn=Math.floor(mn/step)*step;mx=Math.ceil(mx/step)*step;if(mx===mn)mx=mn+step;
  const X=i=>pts.length===1?pl+pw/2:pl+(o.type==='bar'?(i+.5)*pw/pts.length:i*pw/(pts.length-1));
  const Y=v=>pt_+ph-(v-mn)/(mx-mn)*ph;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'chart')}">`;
  for(let v=mn;v<=mx+1e-9;v+=step){const y=Y(v);s+=`<line x1="${pl}" x2="${W-pr}" y1="${n1(y)}" y2="${n1(y)}" class="gl"/><text x="${pl-6}" y="${n1(y+3.5)}" text-anchor="end" class="axl">${fmtNum(v)}</text>`}
  const lblIdx=pts.length<=6?pts.map((_,i)=>i):[0,Math.floor((pts.length-1)/2),pts.length-1];
  lblIdx.forEach(i=>s+=`<text x="${n1(X(i))}" y="${H-6}" text-anchor="middle" class="axl">${esc(pts[i].x)}</text>`);
  s+=`<line class="xh" x1="0" x2="0" y1="${pt_}" y2="${pt_+ph}" stroke="#5a6470" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>`;
  if(o.type==='bar'){const bw=Math.min(24,pw/pts.length*.62);pts.forEach((p,i)=>{const x=X(i)-bw/2,y=Y(+p.v||0),b=Y(mn),hh=Math.max(0,b-y),r=Math.min(4,hh,bw/2);
    s+=`<path d="M${n1(x)},${n1(b)} V${n1(y+r)} Q${n1(x)},${n1(y)} ${n1(x+r)},${n1(y)} H${n1(x+bw-r)} Q${n1(x+bw)},${n1(y)} ${n1(x+bw)},${n1(y+r)} V${n1(b)} Z" fill="var(--ac)"/>`})}
  else{s+=`<path d="${pts.map((p,i)=>(i?'L':'M')+n1(X(i))+','+n1(Y(+p.v||0))).join(' ')}" fill="none" stroke="var(--ac)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    pts.forEach((p,i)=>s+=`<circle cx="${n1(X(i))}" cy="${n1(Y(+p.v||0))}" r="4" fill="var(--ac)" stroke="var(--s1)" stroke-width="2"/>`)}
  s+=`</svg>`;
  CH[id]={xs:pts.map((_,i)=>X(i)),ys:pts.map(p=>Y(+p.v||0)),pts,unit:o.unit||'',W};
  return `<div class="chart" data-chart="${id}">${s}<div class="tip" hidden></div></div>`;
}
function niceStep(r){if(r<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(r)));const f=r/e;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e}
function fmtNum(v){return v>=10000?Math.round(v/1000)+'k':v>=1000?(v/1000).toFixed(1).replace('.0','')+'k':Math.round(v*10)/10}
function bindCharts(){document.querySelectorAll('.chart:not([data-b])').forEach(el=>{el.setAttribute('data-b','1');const c=CH[el.dataset.chart];if(!c)return;
  const svg=el.querySelector('svg'),tip=el.querySelector('.tip'),xh=el.querySelector('.xh');
  const show=ev=>{const r=svg.getBoundingClientRect();const x=(ev.clientX-r.left)/r.width*c.W;let bi=0,bd=1e9;c.xs.forEach((v,i)=>{const d=Math.abs(v-x);if(d<bd){bd=d;bi=i}});
    const p=c.pts[bi];tip.hidden=false;tip.innerHTML=`<b>${fmtNum(+p.v)}${c.unit?' '+c.unit:''}</b>${esc(p.x)}`;
    const px=c.xs[bi]/c.W*r.width;tip.style.left=Math.max(40,Math.min(r.width-40,px))+'px';tip.style.top=Math.max(0,c.ys[bi]/c.W*r.width-52)+'px';
    xh.setAttribute('x1',c.xs[bi]);xh.setAttribute('x2',c.xs[bi]);xh.setAttribute('opacity','1')};
  const hide=()=>{tip.hidden=true;xh.setAttribute('opacity','0')};
  svg.addEventListener('pointermove',show);svg.addEventListener('pointerdown',show);svg.addEventListener('pointerleave',hide)})}

   <p class="small muted" style="margin:0"><b>How calories are estimated:</b> kcal per minute = MET × 3.5 × body weight (kg) ÷ 200, where MET values come from the Compendium of Physical Activities (for example, weight training with 8–15 reps = 3.5; squats and deadlifts = 5.0; stretching = 2.3). Height doesn't change the workout burn. It's used for BMI and resting burn (Mifflin-St Jeor). BMI doesn't account for muscle, so expect it to rise a bit as you build muscle.</p></div>

   <div class="row2"><button class="btn2" onclick="copyBackup()">Copy backup</button><button class="btn2" onclick="$('#restoreBox').classList.toggle('hidden')">Restore</button></div>
   <div id="restoreBox" class="hidden" style="margin-top:10px"><textarea class="field" id="restoreTxt" placeholder="Paste your backup here"></textarea><button class="btn sm" style="margin-top:8px" onclick="restoreBackup()">Restore backup</button></div>
   <textarea class="field hidden" id="backupOut" readonly style="margin-top:10px"></textarea>
   <button class="btn2 sm danger" style="margin-top:14px" onclick="resetAll(this)">Reset all data</button></div>
  <p class="small muted" style="text-align:center">Rebuild · made for your comeback 💪<br>Not medical advice. Check with a doctor if you have injuries or health conditions.</p>`}
function saveProfile(){const p=DB.profile;const ft=+$('#pFt').value,inch=+$('#pIn').value,lb=+$('#pLb').value;
  if(!(ft>=3&&ft<=8)||!(inch>=0&&inch<12)||!(lb>=60&&lb<=700)){toast('Check your height and weight');return}
  const changedW=lb!==+p.lb;Object.assign(p,{ft,inch,lb,age:$('#pAge').value?+$('#pAge').value:'',sex:$('#pSex').value,perWeek:+$('#pPer').value,set:true});
  if(changedW||!DB.bw.length)DB.bw.push({d:new Date().toISOString(),lb});save();toast('Saved. Estimates updated');render()}
function copyBackup(){const txt=JSON.stringify(DB);const o=$('#backupOut');o.value=txt;o.classList.remove('hidden');
  try{navigator.clipboard.writeText(txt).then(()=>toast('Backup copied'),()=>{o.select();toast('Select & copy the text below')})}catch(e){o.select();toast('Select & copy the text below')}}
function restoreBackup(){try{const d=JSON.parse($('#restoreTxt').value);if(!d||!Array.isArray(d.sessions))throw 0;DB=Object.assign({profile:DB.profile,sessions:[],bw:[]},d);save();toast('Backup restored');render()}catch(e){toast('That backup text is not valid')}}
function resetAll(b){if(!b.dataset.c){b.dataset.c=1;b.textContent='Tap again to erase everything';return}DB={profile:{ft:5,inch:8,lb:163,age:'',sex:'',perWeek:3,set:false},sessions:[],bw:[]};ACTIVE=null;save();saveA();render();toast('All data erased')}

/* ================= boot ================= */
render();requestAnimationFrame(frame);
if(!TICK)TICK=setInterval(tickWO,250);
if(location.hash==='#workout'&&ACTIVE)openWO();
</script>
