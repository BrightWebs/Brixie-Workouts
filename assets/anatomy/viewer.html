<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rebuild anatomical muscle views</title>
  <style>
    *{box-sizing:border-box}body{margin:0;color:#e8edf2;background:#10151c;font:13px system-ui,sans-serif}
    #stage{position:relative;height:360px;background:radial-gradient(ellipse at 50% 45%,#26303b 0%,#10151c 70%);overflow:hidden}
    canvas{display:block;width:100%;height:100%}.labels{position:absolute;inset:12px 0 auto;display:flex;justify-content:space-around;pointer-events:none;color:#aab8c8;font-size:10px;letter-spacing:2px;text-transform:uppercase}
    #status{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:20px;line-height:1.6;background:#10151c}
    #status[hidden]{display:none}#status button{margin:10px auto}
    .tools{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;padding:10px 6px}
    button{font:inherit;background:#202a35;color:inherit;border:1px solid #3b4858;border-radius:20px;padding:7px 12px;cursor:pointer}
    button[aria-pressed=true]{border-color:#c8f135;color:#c8f135}button:focus-visible{outline:2px solid #c8f135;outline-offset:2px}
    #selection{margin:0;text-align:center;color:#aab8c8;font-size:11px;min-height:28px;padding:0 12px}
    @media(min-width:500px){#stage{height:400px}}
    @media(prefers-reduced-motion:no-preference){button{transition:color .15s,border-color .15s}}
  </style>
  <script type="importmap">{"imports":{"three":"./three.module.js"}}</script>
</head>
<body>
  <div id="stage">
    <canvas aria-label="Three-dimensional front and back muscle anatomy"></canvas>
    <div class="labels"><span>Anterior / front</span><span>Posterior / back</span></div>
    <div id="status" role="status">Loading licensed 3D anatomy...</div>
  </div>
  <div class="tools" aria-label="Anatomy view controls">
    <button data-angle="0" aria-pressed="true">Front + back</button>
    <button data-angle="0.55" aria-pressed="false">Three-quarter</button>
    <button data-angle="1.57079632679" aria-pressed="false">Side views</button>
    <button id="isolate" aria-pressed="false">Isolate targets</button>
  </div>
  <p id="selection" aria-live="polite"></p>
  <script type="module" src="./viewer.js"></script>
</body>
</html>
